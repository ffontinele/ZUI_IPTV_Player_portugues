<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUI Sync · Painel</title>
<style>
  :root{--bg:#0e0b0a;--card:#181410;--gold:#E8B567;--txt:#eee}
  *{box-sizing:border-box;font-family:system-ui,sans-serif}
  body{margin:0;background:var(--bg);color:var(--txt);padding:16px}
  h1{font-size:20px;color:var(--gold);margin:8px 0}
  .card{background:var(--card);border:1px solid #ffffff14;border-radius:14px;padding:14px;margin:12px 0}
  label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ffffff88;display:block;margin:8px 0 4px}
  input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ffffff22;background:#00000055;color:var(--txt);font-size:14px}
  textarea{font-family:ui-monospace,monospace;font-size:12px;min-height:60px;resize:vertical}
  button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#221;font-weight:700;font-size:15px;cursor:pointer}
  button.sec{background:#ffffff22;color:var(--txt)}
  button.del{background:#a33;color:#fff;width:auto;padding:6px 10px;margin:0}
  button.extract{background:#2a5c2a;color:#fff;margin-top:8px}
  #msg{margin:10px 0;padding:10px;border-radius:8px;font-size:13px;display:none}
  .ok{background:#143a14;color:#9f9}
  .err{background:#3a1414;color:#f99}
  .warn{background:#3a2a14;color:#fc9}
  .row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10;padding:8px 0}
  .small{font-size:12px;color:#ffffff77}
  .help{font-size:11px;color:#ffffff55;margin-top:4px;line-height:1.4}
  .divider{height:1px;background:#ffffff10;margin:16px 0}
  .filled{border-color:#4a9c4a !important;background:#0a2a0a55 !important}
</style>
</head>
<body>
<h1>ZUI Cloud Sync · Seu Painel</h1>

<div class="card">
  <label>TV ID</label><input id="tid">
  <label>Chave do dispositivo</label><input id="tkey">
  <button onclick="verify()">Verificar TV</button>
</div>

<div class="card">
  <label>Nome da lista</label><input id="pname" placeholder="Minha Lista">
  <label>Tipo</label>
  <select id="ptype" onchange="toggleType()">
    <option value="m3u">M3U (qualquer link de lista)</option>
    <option value="xtream">Xtream Codes</option>
  </select>

  <!-- Modo M3U: só URL -->
  <div id="m3uFields">
    <label>URL da lista M3U</label>
    <input id="purl" placeholder="http://servidor/playlist.m3u">
    <div class="help">Cole aqui qualquer URL de lista M3U.</div>
  </div>

  <!-- Modo Xtream: 3 campos SEMPRE visíveis + opção de extrair -->
  <div id="xtreamFields" style="display:none">
    <label>Servidor</label><input id="xhost" placeholder="http://servidor.com:8080">
    <label>Usuário</label><input id="xuser" placeholder="seu usuario">
    <label>Senha</label><input id="xpass" type="password" placeholder="sua senha">

    <div class="divider"></div>
    <div class="help" style="margin-bottom:8px">
      💡 <strong>Opcional:</strong> Cole a URL completa do Xtream e clique em "Extrair" para preencher os campos acima automaticamente.
    </div>
    <label>Cole a URL completa aqui (opcional)</label>
    <textarea id="xurl" placeholder="http://servidor.com:8080/get.php?username=joao&password=123&type=m3u_plus"></textarea>
    <button class="extract" onclick="extractXtream()">🔍 Extrair servidor, usuário e senha</button>
  </div>

  <button onclick="send()">Enviar lista pra TV</button>
</div>

<div class="card">
  <label>Listas enviadas</label>
  <div id="list"></div>
  <button class="sec" onclick="load()">Atualizar</button>
</div>

<div id="msg"></div>

<script>
var BASE='https://fyqpqqrtmgcsjnygxkqv.supabase.co';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5cXBxcXJ0bWdjc2pueWd4a3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzE3NjEsImV4cCI6MjEwMzcwNzc2MX0.QInVAAU7i0GNSkWRzP6HedqkP5U6HJBDRhpQyey0eh8';
var q=new URLSearchParams(location.search);
if(q.get('id'))document.getElementById('tid').value=q.get('id');
if(q.get('key'))document.getElementById('tkey').value=q.get('key');

function H(){
  var id=document.getElementById('tid').value.trim(),
      k=document.getElementById('tkey').value.trim();
  return{
    'apikey':ANON,
    'Authorization':'Bearer '+ANON,
    'Content-Type':'application/json',
    'x-zui-device-id':id,
    'x-zui-device-key':k
  };
}

function M(t,type){
  var m=document.getElementById('msg');
  m.style.display='block';
  m.className=type||'err';
  m.textContent=t;
  setTimeout(function(){m.style.display='none';},5000);
}

function toggleType(){
  var t=document.getElementById('ptype').value;
  document.getElementById('m3uFields').style.display=(t==='m3u')?'block':'none';
  document.getElementById('xtreamFields').style.display=(t==='xtream')?'block':'none';
}

// Extrai servidor/usuário/senha de uma URL Xtream (robusto)
function parseXtream(raw){
  if(!raw||!raw.trim())return null;
  var text=raw.trim().split('\n')[0].trim();
  
  // Adiciona protocolo se faltar
  if(!/^https?:\/\//i.test(text))text='http://'+text;
  
  try {
    var u=new URL(text);
    var params=u.searchParams;
    
    // Tenta vários nomes de parâmetros
    var user=params.get('username')||params.get('user')||params.get('u')||params.get('user_id');
    var pass=params.get('password')||params.get('pass')||params.get('p')||params.get('pwd');
    var host=u.origin; // http://servidor:porta
    
    if(!user||!pass||!host||host==='null'){
      return {error:'URL não contém username/password válidos'};
    }
    
    return {host:host, user:user, pass:pass};
  } catch(e){
    return {error:'URL inválida. Verifique se copiou o link completo.'};
  }
}

// Botão Extrair: pede confirmação e preenche os 3 campos
function extractXtream(){
  var raw=document.getElementById('xurl').value;
  if(!raw.trim()){
    M('Cole a URL completa primeiro.','err');
    return;
  }
  
  var result=parseXtream(raw);
  
  if(result.error){
    M('❌ '+result.error,'err');
    return;
  }
  
  // Confirmação
  var msg='Foram encontrados:\n\n';
  msg+='Servidor: '+result.host+'\n';
  msg+='Usuário: '+result.user+'\n';
  msg+='Senha: '+result.pass+'\n\n';
  msg+='Preencher esses dados nos campos acima?';
  
  if(!confirm(msg)){
    M('Extração cancelada.','warn');
    return;
  }
  
  // Preenche e destaca os campos
  var hostEl=document.getElementById('xhost');
  var userEl=document.getElementById('xuser');
  var passEl=document.getElementById('xpass');
  
  hostEl.value=result.host;
  userEl.value=result.user;
  passEl.value=result.pass;
  
  hostEl.classList.add('filled');
  userEl.classList.add('filled');
  passEl.classList.add('filled');
  
  M('✔ Campos preenchidos automaticamente! Confira e envie.','ok');
}

function verify(){
  fetch(BASE+'/rest/v1/devices?select=device_id,device_key',{headers:H()})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.length>0){
        M('TV encontrada: '+d[0].device_id+' ✔','ok');
        load();
      } else {
        M('TV não encontrada. Confira ID/chave e se o app está aberto na TV.','err');
      }
    }).catch(function(e){M('Erro: '+e,'err');});
}

function send(){
  var type=document.getElementById('ptype').value;
  var name=document.getElementById('pname').value.trim()||'Minha Lista';
  var body={
    device_id:document.getElementById('tid').value.trim(),
    playlist_name:name,
    source_type:type
  };

  if(type==='m3u'){
    var url=document.getElementById('purl').value.trim();
    if(!url){M('Cole a URL da lista M3U.','err');return;}
    body.playlist_url=url;
  } else {
    // Xtream: usa os 3 campos (preenchidos por extração ou manualmente)
    var host=document.getElementById('xhost').value.trim();
    var user=document.getElementById('xuser').value.trim();
    var pass=document.getElementById('xpass').value.trim();
    if(!host||!user||!pass){
      M('Preencha servidor, usuário e senha — ou cole a URL e clique em "Extrair".','err');
      return;
    }
    body.playlist_url=host;
    body.xtream_username=user;
    body.xtream_password=pass;
  }

  fetch(BASE+'/rest/v1/playlists',{
    method:'POST',
    headers:H(),
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    M('Lista "'+name+'" enviada! A TV carrega em segundos ✔','ok');
    // Limpa os campos
    document.getElementById('pname').value='';
    document.getElementById('purl').value='';
    document.getElementById('xurl').value='';
    document.getElementById('xhost').value='';
    document.getElementById('xuser').value='';
    document.getElementById('xpass').value='';
    ['xhost','xuser','xpass'].forEach(function(id){
      document.getElementById(id).classList.remove('filled');
    });
    load();
  }).catch(function(e){M('Erro ao enviar: '+e,'err');});
}

function load(){
  fetch(BASE+'/rest/v1/playlists?select=id,playlist_name,source_type,loaded&order=sent_at.desc',{headers:H()})
    .then(function(r){return r.json();})
    .then(function(d){
      var el=document.getElementById('list');
      el.innerHTML='';
      if(!d||d.length==0){el.innerHTML='<div class="small">Nenhuma lista enviada.</div>';return;}
      d.forEach(function(p){
        var div=document.createElement('div');
        div.className='row';
        div.innerHTML='<span>'+p.playlist_name+' <span class="small">('+p.source_type+')</span></span>';
        var b=document.createElement('button');
        b.className='del';
        b.textContent='✕';
        b.onclick=function(){del(p.id);};
        div.appendChild(b);
        el.appendChild(div);
      });
    }).catch(function(e){});
}

function del(id){
  fetch(BASE+'/rest/v1/playlists?id=eq.'+id,{method:'DELETE',headers:H()})
    .then(function(){M('Lista removida.','ok');load();});
}
</script>
</body>
</html>
